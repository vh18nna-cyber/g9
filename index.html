<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G9</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
   <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

    nav{
        background-color: rgb(29, 25, 25);
        padding: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        
    }

    .logo{
        color: white;
        text-decoration: none;
        font-size: 25px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    a{
        color: white;
        text-decoration: none;
        font-size: 20px;
    }

    .links{
        display: flex;
        gap: 20px;
    }

    .links a:hover{
          color: #00bcd4;
    }

    button{
        font-size: 30px;
        background: none;
        border: none;
        color: white;
        cursor: pointer;
    }

    .hero {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        min-height: 60vh;
        padding: 20px;
        color: white;
        background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("hero.jpg");
        background-size: cover;
        background-position: center;
    }

    .hero-content {
        max-width: 650px;
    }

    .hero-content h1 {
       font-size: 3rem;
       margin-bottom: 15px;
    }

    .hero-content p {
      font-size: 1.25rem;
      margin-bottom: 25px;
    }

    .hero-btn {
     display: inline-block;
     padding: 12px 28px;
     background-color: #ff7b00;
     color: white;
     text-decoration: none;
     border-radius: 5px;
     font-weight: bold;
     transition: background-color 0.3s ease;
    }

    .hero-btn:hover {
     background-color: #e2a063;
    }

 
   </style>
</head>
<body>
    <nav>
        <a href="a" class="logo"><i class="fa-brands fa-amazon"></i>Amazon</a>

        <div class="links">
            <a href="e">Home</a>
            <a href="e">About</a>
            <a href="e">Services</a>
            <a href="e">Contact</a>
        </div>

        <button id="menu-btn"><i class="fa-solid fa-bars"></i></button>
    </nav>

    <section class="hero">
     <div class="hero-content">
        <h1>Welcome to Amazon</h1>
        <p>Buy and explore.</p>
        <a href="#get-started" class="hero-btn">Get Started</a>
     </div>
    </section>

      <script>
        const menuBtn = document.getElementById('menu-btn');
        const navLinks = document.getElementById('links');

        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
